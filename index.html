<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Sitaram · Builds</title>
<meta name="description" content="Small, useful apps built with AI by Sam Sitaram, a product manager who ships.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4; --ink: #17171a; --muted: #62646d; --card: #ffffff; --line: #e4e0d8;
    --accent: #d9481e; --chip: #f1ede5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --ink: #eeece7; --muted: #9b9ea8; --card: #1b1b1f; --line: #2c2c32;
      --accent: #ff7a50; --chip: #26262b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 56px 16px 72px; }
  header { max-width: 680px; margin-bottom: 44px; }
  .hello { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(38px, 7vw, 64px); line-height: 1.02; margin: 10px 0 16px; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--accent); }
  .lede { font-size: 18px; color: var(--muted); margin: 0 0 22px; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { display: block; font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1; }
  .stat span { font-size: 13px; color: var(--muted); }
  .links { margin-top: 22px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; }
  .links a { color: var(--ink); font-weight: 600; }

  h2 { font-family: Fraunces, Georgia, serif; font-size: 26px; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .thumb { display: block; aspect-ratio: 16 / 10; background: var(--chip); overflow: hidden; border-bottom: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card h3 { margin: 0; font-size: 19px; }
  .date { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .blurb { margin: 0; color: var(--muted); font-size: 15px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tags span { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }
  .actions { margin-top: auto; display: flex; gap: 10px; padding-top: 6px; }
  .btn { flex: 1; text-align: center; padding: 9px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; text-decoration: none; }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.ghost { border: 1px solid var(--line); color: var(--ink); }
  footer { margin-top: 56px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="hello">Hi, I'm Sam</div>
    <h1>Product manager who <em>builds</em>.</h1>
    <p class="lede">I use AI to go from idea to a working app fast, usually in a day. Everything here is live and the code is public. Try them.</p>
    <div class="stats">
      <div class="stat"><b id="count">–</b><span>apps shipped</span></div>
      <div class="stat"><b id="latest">–</b><span>latest build</span></div>
    </div>
    <div class="links">
      <a href="https://github.com/sam0">GitHub ↗</a>
    </div>
  </header>

  <section>
    <h2>Builds</h2>
    <div class="grid" id="grid"></div>
  </section>

  <footer>Every app here was designed, coded and shipped with AI as my pair programmer.</footer>
</main>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

fetch('projects.json').then((r) => r.json()).then((items) => {
  items.sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById('count').textContent = items.length;
  document.getElementById('latest').textContent = items.length ? fmt(items[0].date) : '–';
  document.getElementById('grid').innerHTML = items.map((p) => `
    <article class="card">
      <a class="thumb" href="${esc(p.live)}" aria-label="Open ${esc(p.name)}">${p.image ? `<img src="${esc(p.image)}" alt="Screenshot of ${esc(p.name)}" loading="lazy">` : ''}</a>
      <div class="body">
        <div class="top"><h3>${esc(p.name)}</h3><span class="date">${fmt(p.date)}</span></div>
        <p class="blurb">${esc(p.blurb)}</p>
        <div class="tags">${(p.tags || []).map((t) => `<span>${esc(t)}</span>`).join('')}</div>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
        <div class="actions">
          <a class="btn primary" href="${esc(p.live)}">Try it</a>
          ${p.code ? `<a class="btn ghost" href="${esc(p.code)}">Code</a>` : ''}
        </div>
      </div>
    </article>`).join('');
});
</script>
</body>
</html>
